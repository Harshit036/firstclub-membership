spring.application.name=firstclub-membership

# PostgreSQL — values come from env vars on Railway, fallback to local Docker defaults
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/firstclub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:firstclub}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# Server port (Railway sets PORT automatically)
server.port=${PORT:8080}
