services:
  postgres:
    image: postgres:15
    container_name: firstclub-postgres
    environment:
      POSTGRES_DB: firstclub
      POSTGRES_USER: firstclub
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firstclub"]
      interval: 5s
      timeout: 5s
      retries: 5
